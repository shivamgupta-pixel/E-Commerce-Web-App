<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <h1 class="logo">E-Commerce Dashboard</h1>
            <div class="nav-links">
                <button class="nav-btn active" onclick="showSection('users')">Users</button>
                <button class="nav-btn" onclick="showSection('products')">Products</button>
            </div>
        </nav>

        <!-- Users Section -->
        <section id="users" class="section active">
            <h2>User Management</h2>
            
            <!-- Add User Form -->
            <div class="form-container">
                <h3>Add New User</h3>
                <form id="userForm" onsubmit="addUser(event)">
                    <input type="text" id="userName" placeholder="Full Name" required>
                    <input type="email" id="userEmail" placeholder="Email Address" required>
                    <input type="tel" id="userPhone" placeholder="Phone Number">
                    <button type="submit" class="btn btn-primary">Add User</button>
                </form>
            </div>

            <!-- Users List -->
            <div class="list-container">
                <h3>All Users</h3>
                <div id="usersList" class="list">
                    <p class="loading">Loading users...</p>
                </div>
            </div>
        </section>

        <!-- Products Section -->
        <section id="products" class="section">
            <h2>Product Management</h2>
            
            <!-- Add Product Form -->
            <div class="form-container">
                <h3>Add New Product</h3>
                <form id="productForm" onsubmit="addProduct(event)">
                    <input type="text" id="productName" placeholder="Product Name" required>
                    <textarea id="productDescription" placeholder="Description"></textarea>
                    <input type="number" id="productPrice" placeholder="Price" step="0.01" required>
                    <input type="number" id="productStock" placeholder="Stock Quantity" required>
                    <button type="submit" class="btn btn-primary">Add Product</button>
                </form>
            </div>

            <!-- Products List -->
            <div class="list-container">
                <h3>All Products</h3>
                <div id="productsList" class="list">
                    <p class="loading">Loading products...</p>
                </div>
            </div>
        </section>

        <!-- Modal for editing -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle">Edit Item</h2>
                <form id="editForm" onsubmit="saveEdit(event)">
                    <div id="editFormFields"></div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
